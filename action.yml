name: 'Argus PR Reviewer'
description: 'AI PR reviews using Groq Llama 3.3 70B — inline comments with CRITICAL/WARNING/SUGGESTION severity + risk table.'
author: 'Aditya Bhusal'

branding:
  icon: 'eye'
  color: 'green'

inputs:
  groq_api_key:
    description: 'Your Groq API key (get one free at console.groq.com)'
    required: true
  github_token:
    description: 'GitHub token for posting PR comments'
    required: true
    default: ${{ github.token }}

runs:
  using: 'node20'
  main: 'index.js'
